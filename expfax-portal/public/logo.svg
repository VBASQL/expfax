<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD957"/>
      <stop offset="100%" stop-color="#2E9E3E"/>
    </linearGradient>
    <radialGradient id="rayGlow" cx="20%" cy="80%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="iconClip">
      <rect x="5" y="5" width="300" height="300" rx="48" ry="48"/>
    </clipPath>
  </defs>

  <!-- ICON -->
  <g>
    <rect x="5" y="5" width="300" height="300" rx="48" ry="48" fill="url(#greenGrad)"/>
    <g clip-path="url(#iconClip)">
      <g transform="translate(60, 250)">
        <polygon points="0,0 360,-30 360,-10" fill="#ffffff" opacity="0.95"/>
        <polygon points="0,0 360,-90 360,-65" fill="#ffffff" opacity="0.95"/>
        <polygon points="0,0 340,-160 345,-130" fill="#ffffff" opacity="0.95"/>
        <polygon points="0,0 290,-230 305,-205" fill="#ffffff" opacity="0.95"/>
        <polygon points="0,0 220,-285 240,-265" fill="#ffffff" opacity="0.95"/>
        <polygon points="0,0 130,-310 150,-300" fill="#ffffff" opacity="0.95"/>
      </g>
      <rect x="5" y="5" width="300" height="300" fill="url(#rayGlow)"/>
    </g>
    <circle cx="60" cy="250" r="10" fill="#ffffff"/>
  </g>

  <!-- WORDMARK -->
  <g>
    <text x="345" y="160"
          font-size="170"
          font-weight="800"
          fill="#0F1B2D"
          letter-spacing="-2">EXPEDIA</text>
    <rect x="348" y="182" width="120" height="6" rx="3" fill="url(#greenGrad)"/>
    <text x="348" y="250"
          font-size="58"
          font-weight="500"
          fill="#4A5568"
          letter-spacing="1">Business-Speed Telecom</text>
  </g>
</svg>
