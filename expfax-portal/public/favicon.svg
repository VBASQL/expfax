<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 310">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD957"/>
      <stop offset="100%" stop-color="#2E9E3E"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="80%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="5" y="5" width="300" height="300" rx="56" ry="56"/>
